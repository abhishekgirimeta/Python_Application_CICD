
name: Python CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      service-name:
        description: "Human-readable service name (used for artifact names)"
        required: true
        type: string
        default: "Emerson-HTML"
      
      python-version:
        description: "Python version for setup-python (used by the Semgrep scan)"
        required: false
        type: string
        default: "3.11"

      install-command:
        description: "Installation command"
        required: false
        type: string
        default: "pip install -r requirements.txt"
        
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: python-cicd-demo
  BASE_VERSION: "1.0"

jobs:
    # ---------------------------------------------------------------------------
  # JOB 1 - Semgrep scan
  # ---------------------------------------------------------------------------
  test:
    name: Semgrep Scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        if: inputs.install-command != ''
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: |
          python -m pip install --upgrade pip

          for i in 1 2 3; do
            bash -c "$INSTALL_COMMAND" && break

            if [ "$i" -eq 3 ]; then
              echo "::error::Dependency install failed after 3 attempts"
              exit 1
            fi
            echo "Install attempt $i failed, retrying in 10s..."
            sleep 10
          done

      - name: Install Semgrep (FOSS)
        run: pip install semgrep

      - name: Run Semgrep scan
        run: |
          semgrep scan \
            --config 'p/owasp-top-ten' \
            --config 'p/secrets' \
            --config 'p/javascript' \
            --config 'p/typescript' \
            --config 'p/python' \
            --severity ERROR \
            --json \
            --output semgrep-results.json \
            .

      - name: Upload Semgrep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results-${{ inputs.service-name }}-${{ github.run_id }}
          path: semgrep-results.json
          if-no-files-found: warn
          
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Test application
        run: |
          python -m py_compile app.py

      - name: Generate Docker image tags
        id: version
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Read the current version from the root VERSION file
          CURRENT_VERSION=$(tr -d '[:space:]' < VERSION)

          # Validate semantic version format: MAJOR.MINOR.PATCH
          if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION format: $CURRENT_VERSION"
            exit 1
          fi

          # Increment the patch version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          PATCH=$((10#$PATCH + 1))
          VERSION="${MAJOR}.${MINOR}.${PATCH}"

          # Update VERSION in the runner's workspace
          echo "$VERSION" > VERSION

          # Generate both Docker tags
          BRANCH_TAG="${BRANCH_NAME}-${VERSION}"
          COMMIT_TAG="${COMMIT_SHA:0:7}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "branch_tag=${BRANCH_TAG}" >> "$GITHUB_OUTPUT"
          echo "commit_tag=${COMMIT_TAG}" >> "$GITHUB_OUTPUT"

          echo "Previous version: ${CURRENT_VERSION}"
          echo "New version: ${VERSION}"
          echo "Branch tag: ${BRANCH_TAG}"
          echo "Commit tag: ${COMMIT_TAG}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::028205780727:role/GitHubActions-ECR-Push-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          BRANCH_TAG: ${{ steps.version.outputs.branch_tag }}
          COMMIT_TAG: ${{ steps.version.outputs.commit_tag }}
        run: |
          set -euo pipefail

          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}"

          docker build \
            -t "${IMAGE}:${BRANCH_TAG}" \
            -t "${IMAGE}:${COMMIT_TAG}" \
            .

      - name: Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          BRANCH_TAG: ${{ steps.version.outputs.branch_tag }}
          COMMIT_TAG: ${{ steps.version.outputs.commit_tag }}
        run: |
          set -euo pipefail

          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}"

          docker push "${IMAGE}:${BRANCH_TAG}"
          docker push "${IMAGE}:${COMMIT_TAG}"
