
name: Python CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: python-cicd-demo
  BASE_VERSION: "1.0"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Test application
        run: |
          python -m py_compile app.py

      - name: Generate Docker image tags
        id: version
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Read the current version from the root VERSION file
          CURRENT_VERSION=$(tr -d '[:space:]' < VERSION)

          # Validate semantic version format: MAJOR.MINOR.PATCH
          if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION format: $CURRENT_VERSION"
            exit 1
          fi

          # Increment the patch version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          PATCH=$((10#$PATCH + 1))
          VERSION="${MAJOR}.${MINOR}.${PATCH}"

          # Update VERSION in the runner's workspace
          echo "$VERSION" > VERSION

          # Generate both Docker tags
          BRANCH_TAG="${BRANCH_NAME}-${VERSION}"
          COMMIT_TAG="${COMMIT_SHA}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "branch_tag=${BRANCH_TAG}" >> "$GITHUB_OUTPUT"
          echo "commit_tag=${COMMIT_TAG}" >> "$GITHUB_OUTPUT"

          echo "Previous version: ${CURRENT_VERSION}"
          echo "New version: ${VERSION}"
          echo "Branch tag: ${BRANCH_TAG}"
          echo "Commit tag: ${COMMIT_TAG}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::028205780727:role/GitHubActions-ECR-Push-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          BRANCH_TAG: ${{ steps.version.outputs.branch_tag }}
          COMMIT_TAG: ${{ steps.version.outputs.commit_tag }}
        run: |
          set -euo pipefail

          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}"

          docker build \
            -t "${IMAGE}:${BRANCH_TAG}" \
            -t "${IMAGE}:${COMMIT_TAG}" \
            .

      - name: Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          BRANCH_TAG: ${{ steps.version.outputs.branch_tag }}
          COMMIT_TAG: ${{ steps.version.outputs.commit_tag }}
        run: |
          set -euo pipefail

          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}"

          docker push "${IMAGE}:${BRANCH_TAG}"
          docker push "${IMAGE}:${COMMIT_TAG}"
